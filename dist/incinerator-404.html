<html lang="ko">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>404호 소각로</title>
<!-- 글꼴은 온라인일 때만 적용되고, 오프라인(file://)에서는 시스템 글꼴로 대체된다 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Gothic+Coding:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&display=swap">
<style>
/* ==========================================================================
   404호 소각로 — UI 스타일
   색은 모두 :root 토큰으로 정의한다. 게임은 항상 어두운 사무실 톤이므로
   다크 모드에서도 같은 팔레트를 쓴다.
   ========================================================================== */
:root {
  --bg: #0c0b0a;
  --bg-2: #151311;
  --ink: #e9e3d6;
  --ink-dim: #a39b8c;
  --ink-faint: #6d675d;
  --line: #2e2a25;
  --line-2: #433d35;

  --paper: #d8cfbd;
  --paper-2: #c6bba5;
  --paper-ink: #2a241d;
  --paper-line: rgba(60, 80, 120, .18);

  --amber: #f3a64a;
  --amber-dim: #9c6a2e;
  --crt-bg: #120d07;
  --ember: #ff6a2b;
  --blood: #b8322a;
  --steel: #59616b;
  --steel-2: #3a4048;
  --wood: #2a1f17;
  --wood-2: #3a2a1e;
  --ok: #8fbf6a;

  --lum: 1;            /* 등대 밝기 0.15~1 (엔진이 갱신) */
  --corrupt: 0;        /* 기억 훼손도 0~1 (엔진이 갱신) */
  --fire: .3;          /* 소각로 불꽃 세기 */

  --f-ui: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --f-serif: "Nanum Myeongjo", "Noto Serif KR", "AppleMyungjo", "Batang", serif;
  --f-mono: "Nanum Gothic Coding", "D2Coding", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-hand: "Nanum Pen Script", "Gaegu", "Comic Sans MS", cursive;

  --gap: 10px;
  --radius: 6px;
  --tap: 44px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0c0b0a; --ink: #e9e3d6; }
}
:root[data-theme="dark"] { --bg: #0c0b0a; --ink: #e9e3d6; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 15px;
  line-height: 1.5;
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:disabled { cursor: default; }
[hidden] { display: none !important; }

.app {
  position: fixed; inset: 0;
  height: 100dvh;
  display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background: var(--bg);
}

/* ───────────── HUD ───────────── */
.hud {
  flex: 0 0 auto;
  display: flex; align-items: center; gap: 12px;
  padding: 6px 12px;
  background: linear-gradient(#1a1714, #11100e);
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  min-height: 44px;
  z-index: 5;
}
.hud-id { display: flex; flex-direction: column; line-height: 1.2; min-width: 0; }
.hud-dept { color: var(--ink-faint); font-size: 10px; letter-spacing: .08em; }
.hud-badge { font-family: var(--f-mono); color: var(--ink); white-space: nowrap; }
.hud-day { font-family: var(--f-serif); font-weight: 700; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; text-align: center; min-width: 0; }
.hud-gauges { display: flex; gap: 12px; }
.gauge { display: grid; grid-template-columns: auto 90px auto; align-items: center; gap: 6px; }
.gauge-label { color: var(--ink-faint); font-size: 11px; white-space: nowrap; }
.gauge-bar { height: 6px; background: #000; border: 1px solid var(--line-2); border-radius: 3px; overflow: hidden; }
.gauge-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--amber-dim), var(--amber)); transition: width .6s ease; }
.gauge-sus .gauge-bar i { background: linear-gradient(90deg, #6b1d18, var(--blood)); }
.gauge-sus.warn .gauge-val { color: var(--blood); animation: pulse 1s infinite; }
.gauge-val { font-family: var(--f-mono); font-size: 11px; min-width: 52px; color: var(--ink-dim); }
.hud-btns { display: flex; gap: 4px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: transparent; border: 1px solid var(--line-2);
  color: var(--ink-dim); font-size: 16px; line-height: 1;
}
.icon-btn.off { color: var(--ink-faint); text-decoration: line-through; }

/* ───────────── STAGE ───────────── */
.stage { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; position: relative; }

/* 민원 창구 뷰 */
.window-view {
  flex: 0 0 44%;
  position: relative; overflow: hidden;
  border-bottom: 3px solid #000;
  background: #07080a;
}
.scene, .bg-image { position: absolute; inset: 0; filter: brightness(calc(.35 + var(--lum) * .65)); transition: filter 1.2s ease; }
.sky { position: absolute; inset: 0; background:
  radial-gradient(ellipse 60% 40% at 70% 85%, rgba(255, 190, 120, calc(.10 * var(--lum))), transparent 70%),
  linear-gradient(#050608 0%, #0d1117 55%, #1a1d22 78%, #2b2c2c 100%); }
.skyline { position: absolute; left: 0; right: 0; bottom: 18%; width: 100%; height: 42%; fill: #050506; }
.lighthouse { position: absolute; left: 68%; bottom: 18%; width: 3.2%; min-width: 14px; height: 62%; }
.tower {
  position: absolute; inset: 0;
  background: linear-gradient(90deg, #0a0a0b, #1d1c1b 45%, #0a0a0b);
  clip-path: polygon(30% 0, 70% 0, 100% 100%, 0 100%);
}
.lamp {
  position: absolute; top: 0; left: 50%; width: 320%; aspect-ratio: 1; transform: translate(-50%, -50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 236, 200, calc(.25 + .75 * var(--lum))) 0 12%, rgba(255, 180, 90, calc(.35 * var(--lum))) 30%, transparent 70%);
  animation: lampPulse 4s ease-in-out infinite;
}
.beam {
  position: absolute; left: calc(69.6% - 150vmax); top: calc(20% - 150vmax); width: 300vmax; height: 300vmax;
  transform-origin: 50% 50%;
  background: conic-gradient(from 0deg at 50% 50%, rgba(255, 230, 190, calc(.16 * var(--lum))) 0deg, rgba(255, 230, 190, calc(.05 * var(--lum))) 5deg, transparent 8deg, transparent 352deg, rgba(255, 230, 190, calc(.05 * var(--lum))) 355deg, rgba(255, 230, 190, calc(.16 * var(--lum))) 360deg);
  -webkit-mask: radial-gradient(circle at 50% 50%, transparent 0 .4vmax, #000 2vmax, rgba(0,0,0,.4) 40vmax, transparent 75vmax);
          mask: radial-gradient(circle at 50% 50%, transparent 0 .4vmax, #000 2vmax, rgba(0,0,0,.4) 40vmax, transparent 75vmax);
  animation: beamSweep 14s linear infinite;
  mix-blend-mode: screen;
  pointer-events: none;
}
.fog { position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: linear-gradient(transparent, rgba(220, 225, 230, .10) 50%, rgba(230, 232, 235, .16)); }
.bg-image { background-size: cover; background-position: center; opacity: 0; transition: opacity .8s ease, filter 1.2s ease; }
.bg-image.on { opacity: 1; }

.portrait { position: absolute; left: 0; right: 0; bottom: 14%; top: 6%; display: flex; justify-content: center; align-items: flex-end; opacity: 0; transition: opacity .4s ease, transform .4s ease; transform: translateY(8px); pointer-events: none; }
.portrait.on { opacity: 1; transform: none; }
.portrait img { max-height: 100%; max-width: 70%; object-fit: contain; display: none; filter: brightness(calc(.5 + var(--lum) * .5)); }
.portrait.has-img img { display: block; }
.portrait.has-img .silhouette { display: none; }
.silhouette {
  --c: #2b2d33;
  height: 92%; aspect-ratio: 3 / 4; max-width: 60%; opacity: .92;
  background:
    radial-gradient(ellipse 22% 19% at 50% 27%, var(--c) 0 98%, transparent 100%),
    radial-gradient(ellipse 50% 46% at 50% 100%, var(--c) 0 98%, transparent 100%);
  position: relative;
  filter: drop-shadow(0 0 18px rgba(0, 0, 0, .7));
}
.silhouette span { position: absolute; left: 0; right: 0; bottom: 18%; text-align: center; font-size: 11px; letter-spacing: .2em; color: rgba(255, 255, 255, .25); font-family: var(--f-mono); }

.booth { position: absolute; inset: 0; pointer-events: none; }
.booth-glass { position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255, 255, 255, .05) 0 12%, transparent 12% 40%, rgba(255, 255, 255, .03) 40% 44%, transparent 44%); }
.booth-bars { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(25% - 3px), rgba(0, 0, 0, .65) calc(25% - 3px) 25%); }
.booth-counter {
  position: absolute; left: 0; right: 0; bottom: 0; height: 14%;
  background: linear-gradient(#2a2622, #191714);
  border-top: 2px solid #3d3731;
  display: flex; align-items: center; justify-content: center; gap: 16px;
}
.booth-sign { font-family: var(--f-mono); font-size: 11px; letter-spacing: .25em; color: var(--ink-faint); border: 1px solid var(--line-2); padding: 1px 8px; }
.booth-grille { width: 60px; height: 10px; background: repeating-linear-gradient(90deg, #000 0 2px, transparent 2px 5px); opacity: .6; }

/* 대화창 */
.dialogue {
  position: absolute; left: 12px; right: 12px; bottom: 12px;
  max-width: 920px; margin: 0 auto;
  min-height: 92px; max-height: calc(100% - 30px);
  display: flex; flex-direction: column;
  background: rgba(10, 9, 8, .9);
  border: 1px solid var(--line-2);
  border-radius: var(--radius);
  padding: 22px 18px 18px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
  opacity: 0; transform: translateY(10px); pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
  z-index: 3;
}
.dialogue.on { opacity: 1; transform: none; pointer-events: auto; cursor: pointer; }
.nameplate {
  position: absolute; top: -12px; left: 14px;
  background: #1e1b18; border: 1px solid var(--line-2);
  padding: 1px 12px; border-radius: 3px;
  font-family: var(--f-serif); font-weight: 700; font-size: 14px;
  color: var(--nc, var(--ink));
}
.nameplate:empty { display: none; }
.dlg-body { flex: 1 1 auto; min-height: 0; overflow: auto; overscroll-behavior: contain; }
.dlg-text { font-family: var(--f-serif); font-size: 17px; line-height: 1.75; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; min-height: 1.75em; }
.dialogue.narration .dlg-text { color: var(--ink-dim); font-style: italic; }
.dialogue.self .dlg-text { color: #cfd6dd; }
.dlg-next { position: absolute; right: 14px; bottom: 6px; font-size: 11px; color: var(--ink-faint); opacity: 0; }
.dialogue.wait .dlg-next { opacity: 1; animation: bob 1s ease-in-out infinite; }
.choices { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.choices:empty { display: none; }
.choice-btn {
  min-height: var(--tap); text-align: left; padding: 10px 14px;
  background: #1c1916; border: 1px solid var(--line-2); border-radius: 4px;
  font-family: var(--f-serif); font-size: 16px;
}
.choice-btn:hover, .choice-btn:focus-visible { border-color: var(--amber); outline: none; }

/* 검열·훼손 표기 */
.redact { color: #000; background: #000; border-radius: 1px; box-shadow: 0 0 0 1px #000; }
.dlg-text .redact { color: #050505; background: #050505; }
.redacting { animation: redactFlip .18s steps(2) forwards; }
.cor { color: inherit; opacity: .85; }

/* ───────────── 데스크 ───────────── */
.desk {
  flex: 1 1 auto; min-height: 0;
  position: relative;
  display: grid;
  grid-template-columns: minmax(170px, 230px) minmax(0, 1fr) minmax(170px, 240px);
  grid-template-rows: minmax(0, 1fr) auto;
  grid-template-areas: "tray reader furnace" "tools tools tools";
  gap: var(--gap);
  padding: var(--gap);
}
.desk-surface {
  position: absolute; inset: 0; z-index: 0;
  background:
    repeating-linear-gradient(92deg, rgba(0, 0, 0, .12) 0 2px, transparent 2px 18px),
    linear-gradient(180deg, var(--wood-2), var(--wood) 60%, #1d1510);
  filter: brightness(calc(.3 + var(--lum) * .7));
  transition: filter 1.2s ease;
}
.desk > *:not(.desk-surface) { position: relative; z-index: 1; }
.desk.locked .tray-list, .desk.locked .reader-controls { pointer-events: none; }
.desk.locked .tray-list { opacity: .6; }

.panel-title { font-size: 11px; color: var(--ink-faint); letter-spacing: .12em; margin-bottom: 6px; display: flex; justify-content: space-between; }

/* 트레이 */
.tray { grid-area: tray; display: flex; flex-direction: column; min-height: 0;
  background: rgba(0, 0, 0, .35); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; }
.tray-list { flex: 1 1 auto; overflow: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px; }
.mem-card {
  position: relative;
  display: grid; grid-template-columns: 34px 1fr; grid-template-rows: auto auto; column-gap: 8px;
  text-align: left; padding: 8px 8px 8px 6px; min-height: 56px;
  background: linear-gradient(#e7dfcf, #d2c8b4);
  color: var(--paper-ink);
  border: none; border-radius: 3px;
  box-shadow: 0 2px 0 rgba(0, 0, 0, .4), 0 6px 14px rgba(0, 0, 0, .35);
  font-family: var(--f-mono); font-size: 12px; line-height: 1.3;
  touch-action: pan-y;
  transition: transform .15s ease, opacity .2s ease;
  filter: brightness(calc(.55 + var(--lum) * .45));
}
.mem-card::after { /* 영수증 톱니 */
  content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 5px;
  background: linear-gradient(-45deg, transparent 3px, #d2c8b4 0) 0 0 / 8px 5px, linear-gradient(45deg, transparent 3px, #d2c8b4 0) 0 0 / 8px 5px;
}
.mem-card:hover { transform: translateY(-2px) rotate(-.5deg); }
.mem-card .crystal {
  grid-row: 1 / 3; align-self: center; width: 28px; height: 34px;
  background: linear-gradient(135deg, #bfe3ff, #5f8fc7 50%, #2a3e66);
  clip-path: polygon(50% 0, 100% 30%, 82% 100%, 18% 100%, 0 30%);
  box-shadow: inset 0 0 6px #fff;
  opacity: .9;
}
.mem-card .mc-id { font-weight: 700; font-size: 11px; color: #6d6252; }
.mem-card .mc-owner { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mem-card.unreg { background: linear-gradient(#cfc5b1, #b9ad96); }
.mem-card.unreg .crystal { background: linear-gradient(135deg, #3b3b3b, #0d0d0d 50%, #5a1a16); box-shadow: inset 0 0 6px #b8322a; }
.mem-card.self-hint .crystal { animation: crystalFlicker 3.2s infinite; }
.mem-card.dragging { opacity: .25; }
.drag-ghost { position: fixed; z-index: 60; pointer-events: none; transform: rotate(-4deg) scale(1.05); opacity: .95; }

/* 판독기 */
.reader { grid-area: reader; display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
.reader-body {
  flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column;
  background: linear-gradient(#4a4f56, #2c3036);
  border: 1px solid #1b1d21; border-radius: 10px;
  padding: 8px 10px 10px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 8px 20px rgba(0, 0, 0, .5);
}
.reader-slot {
  height: 18px; margin: 0 20% 8px; border-radius: 9px;
  background: #0b0c0e; box-shadow: inset 0 2px 4px #000, 0 1px 0 rgba(255, 255, 255, .15);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; letter-spacing: .3em; color: #555;
}
.reader.drop-ok .reader-slot { box-shadow: inset 0 2px 4px #000, 0 0 0 2px var(--amber); color: var(--amber); }
.reader-screen {
  flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden;
  background: radial-gradient(ellipse at center, #1c140a, var(--crt-bg) 75%);
  border-radius: 8px; border: 2px solid #0a0a0a;
  box-shadow: inset 0 0 30px rgba(0, 0, 0, .9);
  color: var(--amber);
  font-family: var(--f-mono); font-size: 14px;
  text-shadow: 0 0 6px rgba(243, 166, 74, .45);
}
.reader-screen::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background: repeating-linear-gradient(transparent 0 2px, rgba(0, 0, 0, .25) 2px 3px); }
.rd-scan { position: absolute; left: 0; right: 0; height: 30%; top: -30%; pointer-events: none; z-index: 2;
  background: linear-gradient(transparent, rgba(243, 166, 74, .06), transparent); animation: scan 5s linear infinite; }
.rd-idle { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--amber-dim); padding: 16px; font-size: 13px; }
.rd-content { position: absolute; inset: 0; overflow: auto; padding: 12px 14px 16px; z-index: 1; user-select: text; -webkit-user-select: text; }
.reader-screen.loaded .rd-idle { display: none; }
.reader-screen.self { animation: crtFlicker 2.6s infinite; }
.rd-head { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--amber-dim); padding-bottom: 4px; margin-bottom: 8px; font-size: 12px; color: var(--amber-dim); }
.rd-fields { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; margin: 0 0 8px; }
.rd-fields dt { color: var(--amber-dim); }
.rd-fields dd { margin: 0; }
.rd-title { font-weight: 700; }
.rd-image { margin: 6px 0 10px; }
.rd-image img { display: block; max-width: 100%; max-height: 160px; border: 1px solid var(--amber-dim); filter: sepia(.6) saturate(1.3) brightness(.9); }
.rd-preview { margin: 0 0 10px; line-height: 1.7; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; font-family: var(--f-serif); font-size: 15px; color: #ffd9a6; }
.rd-memo { margin: 4px 0 12px; padding: 8px 12px; background: var(--paper); color: #1f2a55; transform: rotate(-1.2deg); font-family: var(--f-hand); font-size: 22px; line-height: 1.2; text-shadow: none; box-shadow: 2px 3px 0 rgba(0, 0, 0, .4); white-space: pre-wrap; }
.rd-memo-label { font-family: var(--f-mono); font-size: 10px; color: #6d6252; display: block; margin-bottom: 2px; }
.rd-cal { display: flex; align-items: baseline; gap: 10px; border-top: 1px dashed var(--amber-dim); padding-top: 6px; }
.rd-cal b { font-size: 26px; letter-spacing: .05em; }
.rd-cal small { color: var(--amber-dim); }
.rd-result { margin-top: 10px; padding: 8px 10px; border: 1px solid var(--amber-dim); color: #ffd9a6; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
.rd-result.burn { border-color: var(--ember); }
.rd-result.hide { border-color: var(--steel); color: #cdd6df; }
.rd-stamp {
  position: absolute; right: 14px; top: 34px; z-index: 3;
  width: 64px; height: 64px; border: 4px double var(--blood); border-radius: 50%;
  color: var(--blood); font-family: var(--f-serif); font-weight: 800; font-size: 34px;
  display: flex; align-items: center; justify-content: center;
  transform: rotate(-14deg); text-shadow: none; opacity: .9;
  mix-blend-mode: screen; animation: stampIn .22s cubic-bezier(.2, 1.6, .4, 1);
  pointer-events: none;
}

.reader-controls { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.grade-row { display: flex; align-items: center; gap: 6px; }
.grade-label { font-size: 11px; color: var(--ink-faint); margin-right: 2px; }
.grade-btn {
  width: var(--tap); height: var(--tap); border-radius: 50%;
  border: 3px double #6b2a24; background: #1a1210; color: #c85a4f;
  font-family: var(--f-serif); font-weight: 800; font-size: 18px;
  transition: transform .1s ease, background .2s;
}
.grade-btn:not(:disabled):hover { background: #2a1714; transform: translateY(-1px); }
.grade-btn:not(:disabled):active { transform: scale(.92); }
.grade-btn:disabled { opacity: .35; }
.grade-btn.picked { background: var(--blood); color: #fff; opacity: 1; border-color: #ff9e94; }
.action-row { display: flex; gap: 8px; flex: 1 1 auto; justify-content: flex-end; }
.act-btn {
  min-height: var(--tap); min-width: 92px; padding: 0 18px; border-radius: 4px;
  font-weight: 700; letter-spacing: .2em; font-size: 15px;
  border: 1px solid #000; box-shadow: 0 3px 0 #000;
  transition: transform .08s ease, filter .2s;
}
.act-btn:not(:disabled):active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
.act-btn:disabled { filter: grayscale(1) brightness(.5); }
.act-burn { background: linear-gradient(#c2452a, #8a2a17); color: #fff2e6; }
.act-hide { background: linear-gradient(#4b535d, #2d333a); color: #dfe6ee; }
.act-btn.attn:not(:disabled) { animation: attn 1.4s ease-in-out infinite; }

/* 소각로 */
.furnace { grid-area: furnace; display: flex; flex-direction: column; min-height: 0;
  background: rgba(0, 0, 0, .35); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; }
.furnace-mouth {
  flex: 1 1 auto; min-height: 80px; position: relative; overflow: hidden;
  border-radius: 40% 40% 6px 6px / 22% 22% 6px 6px;
  background: radial-gradient(ellipse at 50% 100%, rgba(255, 106, 43, calc(.25 + var(--fire) * .5)), #120604 70%);
  border: 6px solid #1b1b1d; box-shadow: inset 0 0 26px #000, 0 0 calc(var(--fire) * 40px) rgba(255, 106, 43, .35);
}
.furnace-mouth canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.furnace-grate { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 14px, rgba(0, 0, 0, .75) 14px 18px); pointer-events: none; }
.furnace.flare .furnace-mouth { animation: flare .9s ease-out; }
.furnace-meter { display: flex; justify-content: space-between; align-items: baseline; margin-top: 6px; font-family: var(--f-mono); }
.fm-label { font-size: 11px; color: var(--ink-faint); }
.fm-val { color: var(--amber); font-size: 18px; }

/* 도구 */
.tools { grid-area: tools; display: flex; gap: 8px; align-items: stretch; }
.tool {
  position: relative; display: flex; align-items: center; gap: 8px;
  min-height: var(--tap); padding: 4px 14px 4px 8px;
  background: rgba(0, 0, 0, .35); border: 1px solid var(--line-2); border-radius: var(--radius);
  font-size: 13px; color: var(--ink-dim);
}
.tool:hover { border-color: var(--amber-dim); color: var(--ink); }
.tool-ico { width: 26px; height: 30px; display: inline-flex; align-items: center; justify-content: center; border-radius: 2px; font-family: var(--f-mono); font-size: 12px; font-weight: 700; color: var(--paper-ink); }
.ico-note { background: linear-gradient(90deg, #5b2d22 0 4px, #8a4a35 4px); box-shadow: inset -2px 0 0 #3a1c15; }
.ico-manual { background: linear-gradient(#5d6a5a, #3c4639); }
.ico-cal { background: linear-gradient(var(--blood) 0 30%, var(--paper) 30%); padding-top: 8px; }
.ico-drawer { background: linear-gradient(#5a4433, #3b2b20); position: relative; }
.ico-drawer::after { content: ""; width: 10px; height: 3px; background: #c9b48e; border-radius: 2px; }
.badge { position: absolute; top: 4px; left: 28px; min-width: 8px; height: 8px; border-radius: 4px; background: var(--ember); display: none; }
.badge.on { display: block; animation: pulse 1.2s infinite; }
.tool-end { margin-left: auto; background: linear-gradient(#6b4d1d, #3e2c10); border-color: var(--amber-dim); color: #ffe2b8; font-weight: 700; letter-spacing: .15em; padding: 4px 20px; animation: attn 1.6s ease-in-out infinite; }

/* ───────────── 오버레이 공통 ───────────── */
.vignette { position: fixed; inset: 0; pointer-events: none; z-index: 20;
  background: radial-gradient(ellipse at center, transparent calc(30% + var(--lum) * 45%), rgba(0, 0, 0, calc(.75 - var(--lum) * .55)) 100%);
  transition: background 1.2s ease; }
.glitch-layer { position: fixed; inset: 0; pointer-events: none; z-index: 70; opacity: 0; }
.glitch-layer.on { animation: glitchLayer .45s steps(6) 1; }
.app.shake { animation: shake .4s ease; }
.app.glitch .stage { animation: glitchSlice .45s steps(5) 1; }
.app.flash::after { content: ""; position: fixed; inset: 0; background: #fff; z-index: 80; pointer-events: none; animation: flashOut .9s ease forwards; }

.toast-wrap { position: fixed; z-index: 75; top: calc(52px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; width: min(92vw, 520px); pointer-events: none; }
.toast { background: rgba(20, 17, 14, .95); border: 1px solid var(--line-2); border-left: 3px solid var(--amber); padding: 8px 12px; border-radius: 4px; font-size: 13px; line-height: 1.5; animation: toastIn .3s ease; box-shadow: 0 6px 20px rgba(0, 0, 0, .5); word-break: keep-all; }
.toast.burn { border-left-color: var(--ember); }
.toast.hide { border-left-color: var(--steel); }
.toast.warn { border-left-color: var(--blood); }
.toast.out { animation: toastOut .4s ease forwards; }

/* 모달 (수첩/매뉴얼/달력/서랍) */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .6); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadeIn .2s ease; }
.modal-card { position: relative; width: min(560px, 100%); max-height: calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow: auto; border-radius: 4px; padding: 28px 22px 22px; animation: paperIn .25s ease; user-select: text; -webkit-user-select: text; }
.paper { background: linear-gradient(var(--paper), var(--paper-2)); color: var(--paper-ink); box-shadow: 0 20px 50px rgba(0, 0, 0, .7), inset 0 0 60px rgba(120, 90, 40, .25); }
.modal-close { position: absolute; top: 4px; right: 4px; width: var(--tap); height: var(--tap); border: none; background: transparent; font-size: 26px; color: var(--paper-ink); opacity: .6; }
.modal-body h2 { font-family: var(--f-serif); font-size: 20px; margin: 0 0 4px; }
.modal-body .sub { font-size: 12px; color: #6d6252; margin: 0 0 14px; }
.modal-body table { width: 100%; border-collapse: collapse; margin: 8px 0 14px; font-family: var(--f-mono); font-size: 14px; }
.modal-body th, .modal-body td { border: 1px solid rgba(42, 36, 29, .35); padding: 6px 8px; text-align: left; }
.modal-body th { background: rgba(42, 36, 29, .1); }
.modal-body ol, .modal-body ul { padding-left: 20px; margin: 0; }
.modal-body li { margin: 4px 0; }
.manual-text { font-family: var(--f-serif); font-size: 14px; line-height: 1.7; }

.notebook { background:
  linear-gradient(90deg, transparent 34px, rgba(184, 50, 42, .35) 34px 35px, transparent 35px),
  repeating-linear-gradient(transparent 0 29px, var(--paper-line) 29px 30px),
  linear-gradient(#e4dccb, #d6ccb7); }
.nb-list { list-style: none; padding: 0 0 0 26px !important; margin: 0; font-family: var(--f-hand); font-size: 24px; line-height: 30px; color: #1f2a55; }
.nb-list li { margin: 0 0 6px; position: relative; word-break: keep-all; overflow-wrap: anywhere; }
.nb-list li.new { animation: inkIn 1.2s ease; }
.nb-list li .nb-date { font-family: var(--f-mono); font-size: 10px; color: #8a7d68; position: absolute; left: -30px; top: 0; width: 26px; text-align: right; line-height: 30px; }
.nb-list .redact { color: #0b0b0b; background: #0b0b0b; }
.nb-empty { font-family: var(--f-hand); font-size: 22px; color: #6d6252; padding-left: 26px; }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 10px 0 12px; font-family: var(--f-mono); }
.cal-cell { aspect-ratio: 1; border: 1px solid rgba(42, 36, 29, .3); display: flex; align-items: center; justify-content: center; position: relative; font-size: 14px; }
.cal-cell.past::after { content: "✕"; position: absolute; color: var(--blood); font-size: 26px; opacity: .7; }
.cal-cell.today { outline: 3px solid var(--blood); outline-offset: -3px; border-radius: 50%; }
.cal-cell.blank { border-color: transparent; }
.cal-list { list-style: none; padding: 0 !important; font-size: 13px; }
.cal-list li { display: flex; gap: 8px; }
.cal-list b { font-family: var(--f-mono); min-width: 48px; }

.drawer-item { border-top: 1px dashed rgba(42, 36, 29, .4); padding: 10px 0; }
.drawer-item h3 { margin: 0; font-family: var(--f-serif); font-size: 15px; }
.drawer-item .di-meta { font-family: var(--f-mono); font-size: 11px; color: #6d6252; }
.drawer-item p { margin: 6px 0 0; font-family: var(--f-serif); font-size: 14px; line-height: 1.6; white-space: pre-wrap; }

.menu-list { display: flex; flex-direction: column; gap: 8px; }
.menu-list button { min-height: var(--tap); text-align: left; padding: 8px 12px; background: rgba(42, 36, 29, .08); border: 1px solid rgba(42, 36, 29, .3); border-radius: 4px; color: var(--paper-ink); }
.menu-list .seg { display: flex; gap: 6px; }
.menu-list .seg button { flex: 1; text-align: center; }
.menu-list .seg button.on { background: var(--paper-ink); color: var(--paper); }

/* ───────────── 전체 화면들 ───────────── */
.screen { position: fixed; inset: 0; z-index: 40; display: flex; align-items: center; justify-content: center; padding: calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); }

.screen-title { background:
  radial-gradient(ellipse at 50% 120%, rgba(255, 106, 43, .25), transparent 60%),
  radial-gradient(ellipse at 50% 40%, #1a1714, #070605 75%); z-index: 45; }
.title-inner { text-align: center; max-width: 560px; width: 100%; }
.title-stamp { display: inline-block; border: 2px solid var(--blood); color: var(--blood); padding: 2px 12px; font-family: var(--f-serif); font-weight: 800; letter-spacing: .4em; font-size: 13px; transform: rotate(-3deg); margin-bottom: 18px; }
.title-main { font-family: var(--f-serif); font-weight: 800; font-size: clamp(34px, 9vw, 64px); margin: 0; letter-spacing: .04em; text-shadow: 0 0 30px rgba(255, 106, 43, .35); }
.title-sub { font-family: var(--f-mono); color: var(--ink-faint); letter-spacing: .4em; font-size: 12px; margin: 6px 0 32px; text-transform: uppercase; }
.title-btns { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.big-btn { min-height: 48px; min-width: 220px; padding: 0 28px; border-radius: 4px; background: linear-gradient(#c2452a, #8a2a17); border: 1px solid #000; box-shadow: 0 3px 0 #000; color: #fff2e6; font-weight: 700; letter-spacing: .25em; font-size: 16px; }
.big-btn.ghost { background: transparent; border-color: var(--line-2); box-shadow: none; color: var(--ink-dim); }
.big-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #000; }
.title-meta { margin-top: 20px; font-size: 12px; color: var(--ink-faint); font-family: var(--f-mono); min-height: 1em; }
.title-note { margin-top: 26px; font-size: 11px; color: var(--ink-faint); letter-spacing: .1em; }
.title-warn { margin: 16px auto 0; max-width: 480px; text-align: left; font-size: 12px; color: #e0b38a; background: rgba(184, 50, 42, .1); border: 1px solid rgba(184, 50, 42, .4); border-radius: 4px; padding: 6px 10px; user-select: text; -webkit-user-select: text; }
.title-warn summary { cursor: pointer; }
.title-warn ul { margin: 6px 0 0; padding-left: 18px; max-height: 30dvh; overflow: auto; }

.screen-daycard { background: rgba(5, 4, 3, .92); animation: fadeIn .5s ease; cursor: pointer; }
.daycard { text-align: center; }
.daycard-date { font-family: var(--f-mono); color: var(--ink-faint); letter-spacing: .3em; font-size: 12px; }
.daycard-title { font-family: var(--f-serif); font-weight: 800; font-size: clamp(26px, 7vw, 44px); margin: 10px 0; animation: stampIn .35s cubic-bezier(.2, 1.6, .4, 1); }
.daycard-quota { font-family: var(--f-mono); color: var(--amber); font-size: 13px; letter-spacing: .1em; }

.screen-report { background: rgba(5, 4, 3, .85); animation: fadeIn .3s ease; }
.report { width: min(560px, 100%); max-height: 100%; overflow: auto; padding: 24px 22px; border-radius: 3px; position: relative; user-select: text; -webkit-user-select: text; }
.report h2 { font-family: var(--f-serif); margin: 0; font-size: 20px; }
.report .sub { margin: 2px 0 14px; font-size: 12px; color: #6d6252; font-family: var(--f-mono); }
.report-row { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 14px; border-bottom: 1px dotted rgba(42, 36, 29, .4); padding: 4px 0; }
.report-items { list-style: none; padding: 0; margin: 14px 0; }
.report-items li { padding: 8px 0; border-bottom: 1px dashed rgba(42, 36, 29, .35); font-size: 14px; line-height: 1.6; }
.report-items .tag { display: inline-block; font-family: var(--f-mono); font-size: 11px; padding: 0 6px; margin-right: 6px; border: 1px solid currentColor; border-radius: 2px; }
.report-items .tag.burn { color: #a4321e; }
.report-items .tag.hide { color: #3c4a5a; }
.report-items .cons { display: block; color: #4a4033; font-family: var(--f-serif); font-size: 13px; margin-top: 2px; }
.report-stamp { position: absolute; right: 18px; top: 18px; border: 4px double var(--blood); color: var(--blood); font-family: var(--f-serif); font-weight: 800; font-size: 22px; padding: 4px 12px; transform: rotate(12deg); opacity: .85; animation: stampIn .3s cubic-bezier(.2, 1.6, .4, 1); }
.report-stamp.ok { border-color: #2f5a2a; color: #2f5a2a; }
.report .big-btn { margin-top: 10px; width: 100%; }

.screen-finale { background: #030202; z-index: 46; }
.finale { width: min(640px, 100%); text-align: center; position: relative; }
.finale-fire { height: 34dvh; position: relative; border-radius: 50% 50% 8px 8px / 30% 30% 8px 8px; overflow: hidden; border: 8px solid #141416; box-shadow: inset 0 0 40px #000, 0 0 60px rgba(255, 106, 43, .3); margin-bottom: 22px; background: radial-gradient(ellipse at 50% 100%, rgba(255, 106, 43, .55), #120604 70%); }
.finale-fire canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.finale-prompt { font-family: var(--f-serif); font-size: 18px; line-height: 1.7; min-height: 3.4em; white-space: pre-wrap; word-break: keep-all; }
.finale-form { display: flex; gap: 8px; margin: 18px auto 8px; max-width: 420px; }
.finale-input { flex: 1 1 auto; min-width: 0; min-height: 50px; font-size: 22px; font-family: var(--f-mono); text-align: center; letter-spacing: .2em; background: #0e0b08; color: var(--amber); border: 1px solid var(--amber-dim); border-radius: 4px; padding: 0 12px; outline: none; caret-color: var(--ember); user-select: text; -webkit-user-select: text; }
.finale-input:focus { border-color: var(--ember); box-shadow: 0 0 0 3px rgba(255, 106, 43, .2); }
.finale-form .big-btn { min-width: 0; padding: 0 18px; letter-spacing: .1em; }
.finale-msg { min-height: 1.6em; color: var(--blood); font-family: var(--f-mono); font-size: 13px; }
.finale-fly { position: fixed; inset: 0; pointer-events: none; }
.fly-char { position: fixed; font-family: var(--f-mono); font-size: 26px; color: var(--amber); text-shadow: 0 0 12px var(--ember); }

.screen-ending { background: #050404; z-index: 47; animation: fadeIn 1.2s ease; }
.ending { width: min(620px, 100%); max-height: 100%; overflow: auto; text-align: center; padding: 8px; user-select: text; -webkit-user-select: text; }
.ending-kicker { font-family: var(--f-mono); color: var(--ink-faint); letter-spacing: .4em; font-size: 11px; }
.ending-title { font-family: var(--f-serif); font-size: clamp(24px, 6vw, 38px); margin: 12px 0 18px; }
.ending-text { font-family: var(--f-serif); font-size: 16px; line-height: 1.9; white-space: pre-wrap; text-align: left; color: var(--ink-dim); word-break: keep-all; min-height: 4em; }
.ending-stats { margin: 22px 0; font-family: var(--f-mono); font-size: 12px; color: var(--ink-faint); display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; }

.window-view.flicker .scene, .window-view.flicker .portrait { animation: crtFlicker .9s steps(3) 1; }

/* 날아가는 결정 */
.fly-card { position: fixed; z-index: 65; pointer-events: none; border-radius: 3px; background: linear-gradient(#e7dfcf, #d2c8b4); box-shadow: 0 8px 20px rgba(0, 0, 0, .5); color: var(--paper-ink); font-family: var(--f-mono); font-size: 11px; display: flex; align-items: center; justify-content: center; padding: 4px; }

/* 디버그 */
.debug { position: fixed; z-index: 90; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); width: 260px; max-height: 60dvh; overflow: auto; background: rgba(0, 0, 0, .9); border: 1px solid #555; color: #9f9; font: 11px/1.4 var(--f-mono); padding: 8px; border-radius: 4px; user-select: text; -webkit-user-select: text; }
.debug button { background: #222; border: 1px solid #555; color: #9f9; margin: 2px; padding: 4px 6px; font-size: 11px; min-height: 28px; }
.debug pre { white-space: pre-wrap; margin: 6px 0 0; color: #cfc; }

/* ───────────── 애니메이션 ───────────── */
@keyframes beamSweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes lampPulse { 50% { filter: brightness(1.25); } }
@keyframes scan { to { top: 100%; } }
@keyframes bob { 50% { transform: translateY(3px); } }
@keyframes pulse { 50% { opacity: .45; } }
@keyframes attn { 50% { box-shadow: 0 3px 0 #000, 0 0 0 3px rgba(243, 166, 74, .35); } }
@keyframes stampIn { from { transform: scale(2.2) rotate(-14deg); opacity: 0; } to { opacity: .9; } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes paperIn { from { transform: translateY(16px) rotate(1deg); opacity: 0; } }
@keyframes toastIn { from { transform: translateY(-8px); opacity: 0; } }
@keyframes toastOut { to { transform: translateY(-8px); opacity: 0; } }
@keyframes inkIn { from { opacity: 0; filter: blur(2px); } }
@keyframes redactFlip { 0% { color: inherit; background: transparent; } 100% { color: #0b0b0b; background: #0b0b0b; } }
@keyframes flare { 0% { filter: brightness(1); } 15% { filter: brightness(2.2) saturate(1.4); } 100% { filter: brightness(1); } }
@keyframes flashOut { from { opacity: .9; } to { opacity: 0; } }
@keyframes shake { 20% { transform: translate(-6px, 2px); } 40% { transform: translate(5px, -3px); } 60% { transform: translate(-4px, 1px); } 80% { transform: translate(3px, 2px); } }
@keyframes crystalFlicker { 0%, 92%, 100% { filter: none; } 94% { filter: hue-rotate(160deg) brightness(1.6); } 96% { filter: invert(1); } }
@keyframes crtFlicker { 0%, 89%, 100% { opacity: 1; transform: none; } 90% { opacity: .7; transform: translateX(2px); } 92% { opacity: 1; transform: translateX(-1px) skewX(2deg); } 94% { opacity: .85; } }
@keyframes glitchSlice {
  0% { clip-path: inset(0 0 0 0); transform: none; filter: none; }
  20% { clip-path: inset(10% 0 60% 0); transform: translateX(-8px); filter: hue-rotate(90deg); }
  40% { clip-path: inset(50% 0 20% 0); transform: translateX(10px); }
  60% { clip-path: inset(30% 0 40% 0); transform: translateX(-4px); filter: invert(.2); }
  80% { clip-path: inset(70% 0 5% 0); transform: translateX(6px); }
  100% { clip-path: inset(0 0 0 0); transform: none; filter: none; }
}
@keyframes glitchLayer {
  0% { opacity: .0; background: none; }
  20% { opacity: .5; background: repeating-linear-gradient(0deg, rgba(255, 0, 60, .15) 0 3px, transparent 3px 9px); }
  50% { opacity: .4; background: repeating-linear-gradient(0deg, rgba(0, 255, 230, .12) 0 2px, transparent 2px 13px); transform: translateX(6px); }
  80% { opacity: .3; background: rgba(255, 255, 255, .05); }
  100% { opacity: 0; }
}

/* ───────────── 반응형 ───────────── */
@media (max-width: 980px) {
  .gauge { grid-template-columns: auto 60px auto; }
  .hud-day { display: none; }
}
@media (max-width: 760px) {
  body { font-size: 14px; }
  .hud { gap: 8px; padding: 4px 10px; }
  .hud-dept { display: none; }
  .hud-gauges { gap: 8px; flex: 1 1 auto; justify-content: flex-end; }
  .gauge { grid-template-columns: auto auto; grid-template-areas: "l v" "b b"; gap: 1px 6px; }
  .gauge-label { grid-area: l; font-size: 10px; }
  .gauge-bar { grid-area: b; width: 76px; }
  .gauge-val { grid-area: v; min-width: 0; font-size: 10px; text-align: right; }
  .window-view { flex-basis: 36%; }
  .dialogue { left: 8px; right: 8px; bottom: 8px; padding: 18px 14px 14px; }
  .dlg-text { font-size: 16px; line-height: 1.65; }
  .desk {
    grid-template-columns: minmax(0, 1fr) 84px;
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "tray tray" "reader furnace" "tools tools";
    gap: 8px; padding: 8px;
  }
  .tray { padding: 6px; }
  .tray .panel-title { margin-bottom: 4px; }
  .tray-list { flex-direction: row; overflow-x: auto; overflow-y: hidden; padding-bottom: 6px; }
  .mem-card { flex: 0 0 150px; min-height: 50px; touch-action: pan-x; }
  .furnace { padding: 6px 4px; }
  .furnace .panel-title { justify-content: center; font-size: 10px; letter-spacing: 0; }
  .furnace-meter { flex-direction: column; align-items: center; }
  .fm-val { font-size: 15px; }
  .reader-body { padding: 6px 8px 8px; }
  .reader-slot { height: 14px; margin-bottom: 6px; }
  .rd-content { padding: 10px; font-size: 13px; }
  .rd-preview { font-size: 14px; }
  .rd-stamp { width: 52px; height: 52px; font-size: 26px; top: 30px; right: 8px; }
  .reader-controls { gap: 6px; }
  .grade-row { gap: 4px; }
  .grade-label { display: none; }
  .grade-btn { width: 40px; height: 40px; font-size: 16px; }
  .action-row { gap: 6px; }
  .act-btn { min-width: 0; flex: 1 1 0; padding: 0 8px; letter-spacing: .1em; }
  .tools { gap: 6px; overflow-x: auto; }
  .tool { padding: 4px 10px 4px 6px; font-size: 12px; flex: 0 0 auto; }
  .tool-ico { width: 22px; height: 26px; }
  .tool-end { padding: 4px 14px; }

@media (max-width: 380px) {

<script>
/* js/audio.js */
/* ==========================================================================
   404호 소각로 — 절차적 사운드 (Web Audio API, 외부 오디오 파일 없음)
   window.Sfx 로 노출된다. 첫 사용자 입력에서 Sfx.init() 을 호출해야 소리가 난다(iOS 제한).

(function () {
  'use strict';

  let ctx = null;
  let master, comp, muffle, sfxBus, ambBus, fireBus;
  const buf = {};
  let muted = false;
  let volume = 0.8;
  let muffleBase = 0;      // 0~1, 기억 상실로 먹먹해지는 정도
  let lastType = 0;
  let mood = null;         // { name, nodes, gain }
  let hum = null;
  let fire = null;
  let fireLevel = 0.3;
  let crackleTimer = null;

  const MOOD_ALIAS = { neutral: 'office', normal: 'office', work: 'office', sad: 'sad', melancholy: 'sad', calm: 'calm', tense: 'tense', dread: 'dread', horror: 'dread', fear: 'dread', warm: 'warm', hope: 'warm', tender: 'warm', silence: 'silence', none: 'silence', office: 'office' };

  // 각 무드: 드론 보이스 [주파수, 파형, 음량], 로우패스, LFO 속도, 추가 노이즈 [종류, 음량, 컷오프], 펄스 [주파수, 음량, 주기]
  const MOODS = {
    office:  { voices: [[60, 'sine', 0.025], [120, 'sine', 0.012], [180, 'triangle', 0.004]], lp: 600, lfo: 0.05, noise: ['pink', 0.012, 900] },
    calm:    { voices: [[110, 'sine', 0.05], [164.81, 'sine', 0.035], [220, 'triangle', 0.012]], lp: 900, lfo: 0.07 },
    tense:   { voices: [[55, 'sawtooth', 0.028], [55.7, 'sawtooth', 0.028], [82.4, 'sawtooth', 0.012]], lp: 380, lfo: 0.12, pulse: [880, 0.008, 1.7] },
    dread:   { voices: [[41.2, 'sine', 0.09], [43.65, 'sine', 0.07], [61.7, 'triangle', 0.02]], lp: 260, lfo: 0.05, noise: ['brown', 0.06, 220] },
    warm:    { voices: [[130.81, 'triangle', 0.03], [164.81, 'triangle', 0.025], [196, 'sine', 0.03], [261.63, 'sine', 0.012]], lp: 1500, lfo: 0.09 },
    sad:     { voices: [[110, 'sine', 0.045], [130.81, 'sine', 0.03], [164.81, 'sine', 0.025], [55, 'sine', 0.03]], lp: 800, lfo: 0.06 },
    silence: null
  };

  function now() { return ctx.currentTime; }

  function makeNoise(type, secs) {
    const len = Math.floor(ctx.sampleRate * secs);
    const b = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = b.getChannelData(0);
    if (type === 'white') {
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    } else if (type === 'pink') { // Paul Kellet
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520; b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.0168980;
        d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
        b6 = w * 0.115926;
      }
    } else { // brown
      let last = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random() * 2 - 1;
        last = (last + 0.02 * w) / 1.02;
        d[i] = last * 3.5;
      }
    }
    return b;
  }

  function noise(type, loop) {
    const s = ctx.createBufferSource();

    s.loop = !!loop;

  }

  function osc(type, f) { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; return o; }

  /** 짧은 엔벨로프: 0 → peak (attack) → 0 (decay) */
  function pluck(g, t, peak, attack, decay) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
  }

  /** 노이즈 한 방 */
  function burst(t, type, ftype, f, q, peak, attack, decay, out) {
    const n = noise(type);
    const fl = filt(ftype, f, q);
    const g = gain(0);
    n.connect(fl); fl.connect(g); g.connect(out || sfxBus);
    pluck(g, t, peak, attack, decay);
    const off = Math.random() * (n.buffer.duration - attack - decay - 0.1);
    n.start(t, Math.max(0, off), attack + decay + 0.05);
    return { n, fl, g };
  }

  /** 톤 한 방 */
  function tone(t, type, f, peak, attack, decay, out, fEnd) {
    const o = osc(type, f);
    const g = gain(0);
    o.connect(g); g.connect(out || sfxBus);
    if (fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, t + attack + decay);
    pluck(g, t, peak, attack, decay);
    o.start(t); o.stop(t + attack + decay + 0.05);
    return o;
  }

  // ───────────────────────── 초기화 ─────────────────────────
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ctx = new AC(); } catch (e) { ctx = null; return false; }

    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    muffle = filt('lowpass', 20000, 0.7);
    sfxBus = gain(1); ambBus = gain(0.55); fireBus = gain(1);

    buf.pink = makeNoise('pink', 4);
    buf.brown = makeNoise('brown', 4);

  // ───────────────────────── 효과음 ─────────────────────────
  /** 타자기/대사 출력 틱. heavy=true 면 최후의 타이핑용 묵직한 타건음 */
  function type(heavy) {
    if (!ctx) return;
    const t = now();
    if (!heavy && t - lastType < 0.028) return;
    lastType = t;
    const k = heavy ? 1.7 : 0.8;
    burst(t, 'white', 'bandpass', 2600 + Math.random() * 2200, 1.4, 0.22 * k, 0.002, 0.028);
    tone(t, 'square', 170 + Math.random() * 70, 0.035 * k, 0.001, 0.022);
    if (heavy) {
      burst(t + 0.004, 'white', 'highpass', 5200, 0.8, 0.12, 0.001, 0.04);
      tone(t, 'sine', 95, 0.25, 0.002, 0.09, null, 55);
    }
  }

  /** 타자기 줄바꿈 벨 */
  function bell() {
    if (!ctx) return;
    const t = now();
    tone(t, 'sine', 2093, 0.12, 0.002, 1.1);
    tone(t, 'sine', 3136, 0.06, 0.002, 0.7);
    tone(t, 'sine', 4186, 0.02, 0.002, 0.4);
  }

  /** 도장 찍는 둔탁한 소리 */
  function stamp() {
    if (!ctx) return;
    const t = now();
    tone(t, 'sine', 160, 0.9, 0.003, 0.28, null, 42);
    burst(t, 'white', 'lowpass', 1100, 0.7, 0.55, 0.002, 0.07);
    burst(t + 0.008, 'white', 'bandpass', 3600, 2, 0.16, 0.001, 0.03);
    tone(t + 0.01, 'triangle', 320, 0.1, 0.001, 0.06, null, 180);
  }

  /** 판독기 투입: 딸깍 + 모터 + 삑 */
  function insert() {
    if (!ctx) return;
    const t = now();
    tone(t, 'square', 1100, 0.08, 0.001, 0.012);
    burst(t, 'white', 'bandpass', 1800, 3, 0.25, 0.001, 0.03);
    const o = osc('sawtooth', 210); const lp = filt('lowpass', 900, 2); const g = gain(0);
    o.connect(lp); lp.connect(g); g.connect(sfxBus);
    o.frequency.linearRampToValueAtTime(340, t + 0.32);
    g.gain.setValueAtTime(0.0001, t + 0.04); g.gain.linearRampToValueAtTime(0.06, t + 0.08); g.gain.linearRampToValueAtTime(0.0001, t + 0.34);
    o.start(t + 0.04); o.stop(t + 0.4);
    tone(t + 0.42, 'sine', 1320, 0.08, 0.004, 0.09);
    tone(t + 0.55, 'sine', 1760, 0.06, 0.004, 0.08);
  }

  /** 짧은 삑 (UI) */
  function beep(f, d) {
    if (!ctx) return;
    tone(now(), 'sine', f || 880, 0.05, 0.003, d || 0.06);
  }

  /** 버튼 클릭 */
  function click() {
    if (!ctx) return;
    const t = now();
    tone(t, 'sine', 620, 0.05, 0.001, 0.02);
    burst(t, 'white', 'highpass', 3000, 0.7, 0.05, 0.001, 0.01);

  /** 거부 버저 */
  function deny() {
    if (!ctx) return;
    const t = now();
    const lp = filt('lowpass', 900, 0.8); lp.connect(sfxBus);
    tone(t, 'square', 110, 0.09, 0.005, 0.32, lp);
    tone(t, 'square', 116.5, 0.09, 0.005, 0.32, lp);
  }

  /** 종이 넘기는 소리 */
  function paper() {
    if (!ctx) return;
    const t = now();
    const b = burst(t, 'white', 'bandpass', 1800, 0.9, 0.18, 0.02, 0.14);
    b.fl.frequency.linearRampToValueAtTime(3600, t + 0.15);
  }

  /** 서랍에 숨기기: 미끄러짐 + 쿵 + 걸쇠 */
  function drawer() {
    if (!ctx) return;
    const t = now();
    const b = burst(t, 'pink', 'bandpass', 320, 1.6, 0.5, 0.05, 0.34);
    b.fl.frequency.exponentialRampToValueAtTime(900, t + 0.36);
    tone(t + 0.38, 'sine', 120, 0.55, 0.003, 0.16, null, 55);
    burst(t + 0.38, 'white', 'lowpass', 700, 0.7, 0.3, 0.002, 0.06);
    tone(t + 0.52, 'square', 2400, 0.03, 0.001, 0.015);
  }

  /** 소각: 화르륵 + 저음 굉음 + 타닥 */
  function burn() {
    if (!ctx) return;
    const t = now();
    const n = noise('pink'); const lp = filt('lowpass', 250, 0.9); const g = gain(0);
    n.connect(lp); lp.connect(g); g.connect(sfxBus);
    lp.frequency.setValueAtTime(250, t);
    lp.frequency.exponentialRampToValueAtTime(3800, t + 0.35);
    lp.frequency.exponentialRampToValueAtTime(700, t + 2.2);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.9, t + 0.15); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.5);
    n.start(t, Math.random(), 2.6);
    const r = noise('brown'); const rl = filt('lowpass', 160, 0.7); const rg = gain(0);
    r.connect(rl); rl.connect(rg); rg.connect(sfxBus);
    rg.gain.setValueAtTime(0.0001, t); rg.gain.exponentialRampToValueAtTime(0.9, t + 0.2); rg.gain.exponentialRampToValueAtTime(0.0001, t + 2.8);
    r.start(t, Math.random(), 2.9);
    for (let i = 0; i < 38; i++) {
      const ct = t + 0.1 + Math.random() * 2.3;
      burst(ct, 'white', 'bandpass', 1500 + Math.random() * 4500, 3, 0.05 + Math.random() * 0.25, 0.001, 0.008 + Math.random() * 0.02);
    }
  }

  /** 글리치 (디지털 파열음) */
  function glitch(strength) {
    if (!ctx) return;
    const s = strength == null ? 1 : strength;
    const t = now();
    const n = Math.round(8 + 10 * s);
    for (let i = 0; i < n; i++) {
      const ct = t + i * 0.022 + Math.random() * 0.01;
      tone(ct, Math.random() < 0.5 ? 'square' : 'sawtooth', 80 + Math.random() * 3800, 0.07 * s, 0.001, 0.015 + Math.random() * 0.02);
      if (Math.random() < 0.4) burst(ct, 'white', 'highpass', 4000, 0.7, 0.08 * s, 0.001, 0.02);
    }
  }

  /** 검게 칠하는 마커 소리 (수첩 문장 소거) */
  function scribble(dur) {
    if (!ctx) return;
    const d = dur || 0.6;
    const t = now();
    const n = noise('white'); const bp = filt('bandpass', 1700, 1.1); const g = gain(0);
    const lfo = osc('square', 13 + Math.random() * 5); const lg = gain(0.09);
    lfo.connect(lg); lg.connect(g.gain);
    n.connect(bp); bp.connect(g); g.connect(sfxBus);
    g.gain.setValueAtTime(0.1, t); g.gain.setValueAtTime(0.1, t + d - 0.05); g.gain.linearRampToValueAtTime(0, t + d);
    n.start(t, Math.random(), d + 0.1); lfo.start(t); lfo.stop(t + d + 0.1);
  }

  /** 노크 (민원 창구 유리) */
  function knock() {
    if (!ctx) return;
    const t = now();
    [0, 0.18, 0.36].forEach(dt => {
      tone(t + dt, 'sine', 210, 0.45, 0.002, 0.12, null, 140);
      burst(t + dt, 'white', 'bandpass', 2400, 2, 0.12, 0.001, 0.03);
    });
  }

  /** 창구 호출 벨 */
  function chime() {
    if (!ctx) return;
    const t = now();
    tone(t, 'sine', 988, 0.12, 0.003, 0.9);
    tone(t + 0.22, 'sine', 784, 0.12, 0.003, 1.1);
  }

  /** 휙 (글자가 소각로로 빨려 들어감) */
  function whoosh() {
    if (!ctx) return;
    const t = now();
    const b = burst(t, 'pink', 'bandpass', 400, 1.2, 0.5, 0.18, 0.4);
    b.fl.frequency.exponentialRampToValueAtTime(3000, t + 0.5);
  }

  /** 심장 박동 */
  function heartbeat() {
    if (!ctx) return;
    const t = now();
    tone(t, 'sine', 62, 0.6, 0.01, 0.16, null, 40);
    tone(t + 0.26, 'sine', 56, 0.45, 0.01, 0.2, null, 38);
  }

  const NAMED = { type: () => type(false), key: () => type(true), typewriter: () => type(true), bell, stamp, insert, beep: () => beep(), click, deny, paper, drawer, burn, glitch: () => glitch(1), scribble: () => scribble(0.7), knock, chime, whoosh, heartbeat };
  function play(name) {
    const f = NAMED[name];
    if (f) f(); else console.warn('[Sfx] 알 수 없는 효과음:', name);
  }

  // ───────────────────────── 소각로 앰비언스 ─────────────────────────
  function startFire() {
    const a = noise('brown', true); const b = noise('pink', true);
    const lp = filt('lowpass', 420, 0.6); const g = gain(0);
    const bg = gain(0.25);
    a.connect(lp); b.connect(bg); bg.connect(lp); lp.connect(g); g.connect(fireBus);
    a.start(); b.start();
    fire = { g, lp };
    setFire(fireLevel);
    crackleTimer = setInterval(() => {
      if (!ctx || ctx.state !== 'running') return;
      const chance = 0.15 + fireLevel * 0.6;
      if (Math.random() < chance) {
        burst(now(), 'white', 'bandpass', 1800 + Math.random() * 4000, 3, 0.02 + fireLevel * 0.08 * Math.random(), 0.001, 0.008 + Math.random() * 0.015, fireBus);
      }
    }, 70);
  }
  function setFire(level) {
    fireLevel = Math.max(0, Math.min(1, level));
    if (!ctx || !fire) return;
    const t = now();
    fire.g.gain.setTargetAtTime(0.04 + fireLevel * 0.2, t, 0.5);
    fire.lp.frequency.setTargetAtTime(260 + fireLevel * 700, t, 0.5);
  }

  // ───────────────────────── 판독기 험 ─────────────────────────
  function setHum(on) {
    if (!ctx) return;
    const t = now();
    if (on && !hum) {
      const g = gain(0);
      const o1 = osc('sine', 50); const o2 = osc('sine', 100);
      const g2 = gain(0.5);
      const w = noise('white', true); const bp = filt('bandpass', 7800, 8); const wg = gain(0.12);
      o1.connect(g); o2.connect(g2); g2.connect(g); w.connect(bp); bp.connect(wg); wg.connect(g);
      g.connect(sfxBus);
      o1.start(); o2.start(); w.start();
      g.gain.setTargetAtTime(0.03, t, 0.2);
      hum = { g, nodes: [o1, o2, w] };
    } else if (!on && hum) {
      const h = hum; hum = null;
      h.g.gain.setTargetAtTime(0, t, 0.15);
      setTimeout(() => h.nodes.forEach(n => { try { n.stop(); } catch (e) { /* 이미 정지 */ } }), 900);
    }
  }

  // ───────────────────────── 무드 앰비언트 ─────────────────────────
  function setMood(name) {
    if (name == null) return;
    const key = MOOD_ALIAS[name] || (MOODS.hasOwnProperty(name) ? name : null);
    if (!key) { console.warn('[Sfx] 알 수 없는 bgmMood:', name, '(사용 가능: office, calm, tense, dread, warm, sad, silence)'); return; }
    if (mood && mood.name === key) return;
    if (!ctx) { mood = { name: key, pending: true }; return; }
    const t = now();
    if (mood && mood.gain) {
      const old = mood;
      old.gain.gain.cancelScheduledValues(t);
      old.gain.gain.setTargetAtTime(0, t, 0.8);
      setTimeout(() => old.nodes.forEach(n => { try { n.stop(); } catch (e) { /* 정지됨 */ } }), 4000);
    }
    const def = MOODS[key];
    if (!def) { mood = { name: key, nodes: [], gain: null }; return; }
    const g = gain(0);
    const lp = filt('lowpass', def.lp, 0.8);
    lp.connect(g); g.connect(ambBus);
    const nodes = [];
    def.voices.forEach(([f, ty, v]) => {
      const o = osc(ty, f); const vg = gain(v);
      o.detune.value = (Math.random() - 0.5) * 8;
      o.connect(vg); vg.connect(lp); o.start(); nodes.push(o);
    });
    const lfo = osc('sine', def.lfo); const lfoG = gain(def.lp * 0.35);
    lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start(); nodes.push(lfo);
    if (def.noise) {
      const [nt, nv, nf] = def.noise;
      const n = noise(nt, true); const nl = filt('lowpass', nf, 0.7); const ng = gain(nv);
      n.connect(nl); nl.connect(ng); ng.connect(g); n.start(); nodes.push(n);
    }
    if (def.pulse) {
      const [pf, pv, pr] = def.pulse;
      const p = osc('sine', pf); const pg = gain(0);
      const pl = osc('sine', 1 / pr); const plg = gain(pv);
      pl.connect(plg); plg.connect(pg.gain); p.connect(pg); pg.connect(g);
      p.start(); pl.start(); nodes.push(p, pl);
    }
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(1, t + 2.5);
    mood = { name: key, nodes, gain: g };
  }

  // ───────────────────────── 먹먹함 (로우패스) ─────────────────────────
  function cutoffFor(level) { return Math.max(380, 20000 * Math.pow(0.035, level)); }
  function setMuffle(level) {
    muffleBase = Math.max(0, Math.min(1, level));
    if (!ctx) return;
    muffle.frequency.setTargetAtTime(cutoffFor(muffleBase), now(), 0.6);
  }
  /** 자기 기억을 태운 순간: 확 먹먹해졌다가 새 기준점으로 돌아온다 */
  function muffleDip() {
    if (!ctx) return;
    const t = now();
    muffle.frequency.cancelScheduledValues(t);
    muffle.frequency.setTargetAtTime(240, t, 0.05);
    muffle.frequency.setTargetAtTime(cutoffFor(muffleBase), t + 1.2, 1.1);
    const g = master.gain;
    g.cancelScheduledValues(t);
    g.setTargetAtTime((muted ? 0 : volume) * 0.45, t, 0.05);
    g.setTargetAtTime(muted ? 0 : volume, t + 1.0, 0.8);
  }

  // ───────────────────────── 볼륨 ─────────────────────────
  function setMuted(m) {
    muted = !!m;
    if (ctx) master.gain.setTargetAtTime(muted ? 0 : volume, now(), 0.05);
  }
  function setVolume(v) {
    volume = Math.max(0, Math.min(1, v));
    if (ctx && !muted) master.gain.setTargetAtTime(volume, now(), 0.05);
  }

  window.Sfx = {
    init() {
      const ok = init();
      if (ok && mood && mood.pending) { const n = mood.name; mood = null; setMood(n); }
      return ok;
    },
    get ready() { return !!ctx; },
    get muted() { return muted; },
    play, type, bell, stamp, insert, beep, click, deny, paper, drawer, burn, glitch, scribble, knock, chime, whoosh, heartbeat,
    setFire, setHum, setMood, setMuffle, muffleDip, setMuted, setVolume,
    get volume() { return volume; },
    MOODS: Object.keys(MOODS),
    SFX: Object.keys(NAMED)
  };
})();

<script>
/* js/engine.js */
/* ==========================================================================
   404호 소각로 — 게임 엔진 (상태 관리 · 진행 · UI)
   window.GAME_DATA (또는 window.STORY_DATA) 를 읽어 화면을 구동한다.
   이 파일에는 스토리 문장을 넣지 않는다. 화면에 나오는 이야기 텍스트는 전부 데이터에서 온다.
   ========================================================================== */
(function () {
  'use strict';

  // ════════════════════════ 1. 유틸 ════════════════════════
  const $ = (id) => document.getElementById(id);
  const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const arr = (v) => (v == null ? [] : Array.isArray(v) ? v : [v]);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const chars = (s) => Array.from(String(s == null ? '' : s));
  function hash(str) { let x = 2166136261; for (let i = 0; i < str.length; i++) { x ^= str.charCodeAt(i); x = Math.imul(x, 16777619); } return (x >>> 0) / 4294967296; }
  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const Sfx = window.Sfx || new Proxy({}, { get: () => () => {} });

  function mixHex(hex, withHex, t) {
    const p = (x) => { const m = /^#?([0-9a-f]{6})$/i.exec(String(x || '').trim()); if (!m) return null; const n = parseInt(m[1], 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
    const a = p(hex), b = p(withHex);
    if (!a || !b) return withHex;
    return '#' + a.map((v, i) => Math.round(v * t + b[i] * (1 - t)).toString(16).padStart(2, '0')).join('');
  }

  // ════════════════════════ 2. 데이터 정규화 · 점검 ════════════════════════
  const WARN = [];
  const warned = new Set();
  function warn(msg) { if (warned.has(msg)) return; warned.add(msg); WARN.push(msg); console.warn('[GAME_DATA] ' + msg); }

  const DEFAULT_RULES = {
    requireGrade: true,
    gradeTable: [{ grade: 'S', min: 200 }, { grade: 'A', min: 120 }, { grade: 'B', min: 60 }, { grade: 'C', min: 0 }],
    hideSuspicion: 15,
    wrongGradeSuspicion: 5,
    quotaMissSuspicion: 20,
    maxSuspicion: 100,
    startSuspicion: 0,
    baseLight: 0.4,
    hideDarken: 0.05,
    hintSelfMemories: true
  };
  const KNOWN_EFFECTS = ['shake', 'glitch', 'flash', 'flicker', 'dark'];
  const MOOD_NAMES = ['office', 'calm', 'tense', 'dread', 'warm', 'sad', 'silence', 'neutral', 'normal', 'work', 'melancholy', 'horror', 'fear', 'hope', 'tender', 'none'];

  const RAW = window.GAME_DATA || window.STORY_DATA || null;
  const MEM = {};      // id → memory
  const D = normalize(RAW);
  const TOTAL_SELF = Object.values(MEM).filter((m) => m.isProtagonistMemory).length;
  const DATA_SIG = D.chapters.map((c) => c.id + ':' + c.seizedMemories.length).join('|');
  const rules = D.meta.rules;
  validate();

  function normalize(raw) {
    if (!raw || typeof raw !== 'object') {
      warn('window.GAME_DATA 를 찾을 수 없습니다. data/story-data.js 가 엔진보다 먼저 로드되는지 확인하세요.');
      raw = { chapters: [] };
    }
    const m = raw.meta || {};
    const r = Object.assign({}, DEFAULT_RULES, m.rules || {});
    r.gradeTable = arr(r.gradeTable).length ? arr(r.gradeTable).slice().sort((a, b) => (b.min || 0) - (a.min || 0)) : DEFAULT_RULES.gradeTable;
    const protagonist = Object.assign({ id: '0404', name: '#0404' }, m.protagonist || {});
    const selfNames = new Set(['#' + protagonist.id, String(protagonist.id), protagonist.name, '나', '주인공'].concat(arr(protagonist.aliases)));
    const meta = {
      title: m.title || '404호 소각로',
      subtitle: m.subtitle || 'Incinerator No. 404',
      protagonist, selfNames, rules: r,
      gameOverEnding: m.gameOverEnding || null,
      defaultEnding: m.defaultEnding || null,
      manual: arr(m.manual)
    };

    const chapters = arr(raw.chapters).map((c, i) => {
      c = c || {};
      return {
        index: i,
        id: c.id || ('ch' + (i + 1)),
        title: c.title || ('제' + (i + 1) + '일차'),
        date: c.date || '',
        quota: Number(c.quota) || 0,
        background: c.background || null,
        bgmMood: c.bgmMood || null,
        dialogues: arr(c.dialogues),
        outroDialogues: arr(c.outroDialogues),
        events: arr(c.events),
        seizedMemories: arr(c.seizedMemories).map((mm, j) => normMem(mm, c, i, j)),
        finale: c.finale || null,
        next: c.next == null ? null : c.next,
        skipReport: !!c.skipReport
      };
    });

    const characters = {};
    Object.entries(raw.characters || {}).forEach(([k, v]) => {
      v = v || {};
      characters[k] = { displayName: v.displayName || v.name || k, color: v.color || '#8a8170', portraits: v.portraits || {} };
    });

    const notebook = arr(raw.notebook).map((e, i) => ({
      id: (e && e.id) || ('nb_' + (i + 1)),
      text: (e && e.text) || '',
      day: e && e.day != null ? e.day : null,
      condition: e && e.condition,
      erasedBy: arr(e && e.erasedBy)
    }));
    // 기억 쪽에서 지정한 erasesNotebook 도 수첩 항목에 연결
    Object.values(MEM).forEach((mm) => arr(mm.erasesNotebook).forEach((nid) => {
      const e = notebook.find((x) => x.id === nid);
      if (e) { if (!e.erasedBy.includes(mm.id)) e.erasedBy.push(mm.id); } else warn(`${mm.id}.erasesNotebook: 수첩 항목 "${nid}" 이 없습니다.`);
    }));

    const endings = {};
    Object.entries(raw.endings || {}).forEach(([k, v]) => { endings[k] = arr(v).map((x) => Object.assign({ title: '', epilogue: '', dialogues: [] }, x)); });

    return { meta, chapters, characters, notebook, endings };
  }

  function normMem(mm, c, ci, j) {
    mm = mm || {};
    const id = mm.id || (`${c.id || 'ch' + (ci + 1)}_mem${j + 1}`);
    if (!mm.id) warn(`${c.id || '챕터 ' + (ci + 1)}의 ${j + 1}번째 압류품에 id 가 없어 "${id}" 로 지정했습니다.`);
    if (MEM[id]) warn(`압류품 id 중복: "${id}"`);
    const out = Object.assign({}, mm, {
      id,
      chapterId: c.id,
      owner: mm.owner == null ? '' : mm.owner,
      title: mm.title == null ? '' : mm.title,
      previewText: mm.previewText == null ? '' : mm.previewText,
      calories: Number(mm.calories) || 0,
      isProtagonistMemory: !!mm.isProtagonistMemory,
      onBurn: arr(mm.onBurn),
      onHide: arr(mm.onHide)
    });
    MEM[id] = out;
    return out;
  }

  // 조건식·참조 점검: 제미나이가 넣은 데이터의 오타를 미리 잡아 타이틀 화면에 보여준다
  function validate() {
    if (!D.chapters.length) warn('chapters 가 비어 있습니다.');
    const chapterIds = new Set(D.chapters.map((c) => c.id));
    const endingIds = new Set(Object.keys(D.endings));
    const speakersSeen = new Set();

    const checkCond = (cond, where) => {
      arr(cond).forEach((c) => {
        if (c == null || typeof c === 'boolean') return;
        if (typeof c === 'object') { ['all', 'any'].forEach((k) => c[k] && checkCond(c[k], where)); if (c.not) checkCond(c.not, where); return; }
        String(c).split(/\|\||&&/).forEach((atom) => {
          const t = atom.trim().replace(/^!+/, '').trim();
          if (!t) return;
          let m;
          if ((m = /^(burned|hidden|processed)\s*:\s*(.+)$/.exec(t))) { if (!MEM[m[2].trim()]) warn(`${where}: 조건 "${t}" 의 압류품 "${m[2].trim()}" 이 없습니다.`); return; }
          if ((m = /^(quotaMet|quotaMissed)\s*:\s*(.+)$/.exec(t))) { if (!chapterIds.has(m[2].trim())) warn(`${where}: 조건 "${t}" 의 챕터 "${m[2].trim()}" 이 없습니다.`); return; }
          if (/^(flag|chapter)\s*:/.test(t)) return;
          if (/^(suspicion|burnedSelf|burnedCount|hiddenCount|heat|totalHeat|day)\s*(>=|<=|==|!=|>|<|=)\s*-?\d+(\.\d+)?$/.test(t)) return;
          warn(`${where}: 해석할 수 없는 조건식 "${t}"`);
        });
      });
    };
    const checkText = (txt, where) => {
      const re = /\[\[([^|\]]+)\|([^\]]*)\]\]/g; let m;
      while ((m = re.exec(String(txt || '')))) { const k = m[1].trim(); if (!MEM[k]) checkCond(k, where + ' [[…]]'); }
    };
    const checkLines = (lines, where) => {
      const labels = new Set(arr(lines).map((l) => l && l.label).filter(Boolean));
      arr(lines).forEach((l, i) => {
        if (!l || typeof l !== 'object') { warn(`${where}[${i}]: 대사 줄이 객체가 아닙니다.`); return; }
        const w = `${where}[${i}]`;
        checkCond(l.condition, w); checkText(l.text, w);
        if (l.speaker && !D.characters[l.speaker] && !D.meta.selfNames.has(l.speaker) && !['나레이션', 'narration'].includes(l.speaker) && !speakersSeen.has(l.speaker)) {
          speakersSeen.add(l.speaker); warn(`${w}: characters 에 "${l.speaker}" 정의가 없어 기본 실루엣으로 표시합니다.`);
        }
        if (l.bgmMood && !MOOD_NAMES.includes(l.bgmMood)) warn(`${w}: 알 수 없는 bgmMood "${l.bgmMood}" (사용 가능: office, calm, tense, dread, warm, sad, silence)`);
        if (l.effect && !KNOWN_EFFECTS.includes(l.effect)) warn(`${w}: 알 수 없는 effect "${l.effect}" (사용 가능: ${KNOWN_EFFECTS.join(', ')})`);
        if (l.sfx && Sfx.SFX && !Sfx.SFX.includes(l.sfx)) warn(`${w}: 알 수 없는 sfx "${l.sfx}" (사용 가능: ${Sfx.SFX.join(', ')})`);
        if (l.goto && l.goto !== 'end' && !labels.has(l.goto)) warn(`${w}: goto "${l.goto}" 라벨이 같은 대사 목록 안에 없습니다.`);
        arr(l.choices).forEach((c, k) => {
          checkCond(c.condition, `${w}.choices[${k}]`); checkText(c.text, `${w}.choices[${k}]`);
          if (c.goto && c.goto !== 'end' && !labels.has(c.goto)) warn(`${w}.choices[${k}]: goto "${c.goto}" 라벨이 없습니다.`);
        });
      });
    };

    D.chapters.forEach((c) => {
      const w = c.id;
      if (!c.quota && c.seizedMemories.length) warn(`${w}: quota 가 0 입니다 (할당량 판정이 항상 달성으로 처리됨).`);
      checkLines(c.dialogues, `${w}.dialogues`);
      checkLines(c.outroDialogues, `${w}.outroDialogues`);
      c.events.forEach((ev, i) => {
        checkCond(ev.condition, `${w}.events[${i}]`);
        if (typeof ev.after === 'string' && !['start', 'end'].includes(ev.after) && !MEM[ev.after]) warn(`${w}.events[${i}]: after "${ev.after}" 압류품이 없습니다.`);
        checkLines(ev.dialogues, `${w}.events[${i}].dialogues`);
      });
      c.seizedMemories.forEach((m) => {
        const mw = `${w}.${m.id}`;
        ['title', 'previewText'].forEach((k) => { if (!m[k]) warn(`${mw}: ${k} 가 비어 있습니다.`); });
        if (!m.calories) warn(`${mw}: calories 가 0 입니다.`);
        if (m.grade && !rules.gradeTable.some((g) => g.grade === m.grade)) warn(`${mw}: grade "${m.grade}" 가 gradeTable 에 없습니다.`);
        checkCond(m.condition, mw); checkText(m.previewText, mw); checkText(m.title, mw);
        checkLines(m.onBurn, `${mw}.onBurn`); checkLines(m.onHide, `${mw}.onHide`);
      });
      if (c.finale) {
        if (!arr(c.finale.answers).length) warn(`${w}.finale: answers 가 비어 있습니다.`);
        arr(c.finale.answers).forEach((a, i) => { if (!endingIds.has(a.ending)) warn(`${w}.finale.answers[${i}]: 엔딩 "${a.ending}" 이 endings 에 없습니다.`); checkCond(a.condition, `${w}.finale.answers[${i}]`); });
        if (c.finale.fallbackEnding && !endingIds.has(c.finale.fallbackEnding)) warn(`${w}.finale: fallbackEnding "${c.finale.fallbackEnding}" 이 없습니다.`);
      }
      arr(c.next).forEach((n) => {
        if (typeof n === 'string') { if (n.startsWith('ending:')) { if (!endingIds.has(n.slice(7))) warn(`${w}.next: 엔딩 "${n.slice(7)}" 이 없습니다.`); } else if (!chapterIds.has(n)) warn(`${w}.next: 챕터 "${n}" 이 없습니다.`); }
        else if (n) { checkCond(n.condition, `${w}.next`); if (n.chapter && !chapterIds.has(n.chapter)) warn(`${w}.next: 챕터 "${n.chapter}" 이 없습니다.`); if (n.ending && !endingIds.has(n.ending)) warn(`${w}.next: 엔딩 "${n.ending}" 이 없습니다.`); }
      });
    });
    D.notebook.forEach((e) => {
      checkCond(e.condition, `notebook.${e.id}`); checkText(e.text, `notebook.${e.id}`);
      e.erasedBy.forEach((id) => { if (!MEM[id]) warn(`notebook.${e.id}.erasedBy: 압류품 "${id}" 이 없습니다.`); });
    });
    Object.entries(D.endings).forEach(([k, vs]) => vs.forEach((v, i) => { checkCond(v.condition, `endings.${k}[${i}]`); checkLines(v.dialogues, `endings.${k}[${i}].dialogues`); }));
    if (D.meta.gameOverEnding && !endingIds.has(D.meta.gameOverEnding)) warn(`meta.gameOverEnding "${D.meta.gameOverEnding}" 이 endings 에 없습니다.`);
    if (!D.chapters.some((c) => c.finale) && !D.meta.defaultEnding) warn('finale 이 있는 챕터도, meta.defaultEnding 도 없습니다. 마지막 챕터 뒤에는 기본 종료 화면이 나옵니다.');
  }

  // ════════════════════════ 3. 저장 ════════════════════════
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 불가 환경 */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* 무시 */ } }
  };
  const KEY_SAVE = 'incinerator404.save.v1';
  const KEY_META = 'incinerator404.meta.v1';
  const KEY_SET = 'incinerator404.settings.v1';
  const settings = Object.assign({ speed: 28, muted: false }, LS.get(KEY_SET, {}));
  const saveSettings = () => LS.set(KEY_SET, settings);

  // ════════════════════════ 4. 상태 · 조건식 ════════════════════════
  function freshState() {
    return {
      chapterIndex: 0, phase: 'title',
      burned: [], hidden: [], processed: [], flags: [],
      suspicion: Number(rules.startSuspicion) || 0,
      burnedSelf: 0, totalHeat: 0, dayHeat: 0,
      quota: {}, grades: {}, dayLog: [], history: [],
      firedEvents: [], seenNotebook: [], finaleAnswer: null
    };
  }
  let S = freshState();

  function saveGame() { LS.set(KEY_SAVE, { v: 1, sig: DATA_SIG, at: Date.now(), state: S }); }
  function loadSave() { const s = LS.get(KEY_SAVE, null); return s && s.sig === DATA_SIG && s.state ? s : null; }

  const curChapter = () => D.chapters[S.chapterIndex] || null;
  const corruptLevel = () => (TOTAL_SELF ? clamp(S.burnedSelf / TOTAL_SELF, 0, 1) : 0);

  function evalCond(c) {
    if (c == null || c === '') return true;
    if (typeof c === 'boolean') return c;
    if (Array.isArray(c)) return c.every(evalCond);
    if (typeof c === 'object') {
      if (c.all) return arr(c.all).every(evalCond);
      if (c.any) return arr(c.any).some(evalCond);
      if (c.not) return !evalCond(c.not);
      return true;
    }
    const s = String(c).trim();
    if (s.includes('||')) return s.split('||').some((p) => evalCond(p));
    if (s.includes('&&')) return s.split('&&').every((p) => evalCond(p));
    let t = s, neg = false;
    while (t.startsWith('!')) { neg = !neg; t = t.slice(1).trim(); }
    const r = evalAtom(t);
    return neg ? !r : r;
  }
  function evalAtom(t) {
    let m;
    if ((m = /^(burned|hidden|processed|flag|quotaMet|quotaMissed|chapter)\s*:\s*(.+)$/.exec(t))) {
      const v = m[2].trim();
      switch (m[1]) {
        case 'burned': return S.burned.includes(v);
        case 'hidden': return S.hidden.includes(v);
        case 'processed': return S.processed.includes(v);
        case 'flag': return S.flags.includes(v);
        case 'quotaMet': return S.quota[v] === true;
        case 'quotaMissed': return S.quota[v] === false;
        case 'chapter': return !!curChapter() && curChapter().id === v;
      }
    }
    if ((m = /^(suspicion|burnedSelf|burnedCount|hiddenCount|heat|totalHeat|day)\s*(>=|<=|==|!=|>|<|=)\s*(-?\d+(?:\.\d+)?)$/.exec(t))) {
      const vars = { suspicion: S.suspicion, burnedSelf: S.burnedSelf, burnedCount: S.burned.length, hiddenCount: S.hidden.length, heat: S.dayHeat, totalHeat: S.totalHeat, day: S.chapterIndex + 1 };
      const a = vars[m[1]], b = Number(m[3]);
      switch (m[2]) { case '>=': return a >= b; case '<=': return a <= b; case '>': return a > b; case '<': return a < b; case '!=': return a !== b; default: return a === b; }
    }
    return false;
  }

  function addFlag(f) { if (f && !S.flags.includes(f)) S.flags.push(f); }
  function addSuspicion(n) { if (!n) return; S.suspicion = clamp(S.suspicion + Number(n), 0, Math.max(100, rules.maxSuspicion || 100)); updateHUD(); }
  function applyEffects(o) {
    if (!o) return;
    arr(o.setFlags).forEach(addFlag);
    arr(o.clearFlags).forEach((f) => { S.flags = S.flags.filter((x) => x !== f); });
    const e = o.effects;
    if (e) {
      arr(e.setFlags).forEach(addFlag);
      arr(e.clearFlags).forEach((f) => { S.flags = S.flags.filter((x) => x !== f); });
      if (e.suspicion) addSuspicion(e.suspicion);
      if (e.heat) { S.dayHeat += Number(e.heat) || 0; S.totalHeat += Number(e.heat) || 0; }
    }
  }
  /** burnEffects / hideEffects 처럼 효과 객체 자체를 받는 경우 */
  function applyEffectObject(e) {
    if (!e) return;
    arr(e.setFlags).forEach(addFlag);
    arr(e.clearFlags).forEach((f) => { S.flags = S.flags.filter((x) => x !== f); });
    if (e.suspicion) addSuspicion(e.suspicion);
    if (e.heat) { S.dayHeat += Number(e.heat) || 0; S.totalHeat += Number(e.heat) || 0; }
  }
  function gradeFor(m) {
    if (m.grade) return m.grade;
    const row = rules.gradeTable.find((g) => m.calories >= (g.min || 0));
    return row ? row.grade : rules.gradeTable[rules.gradeTable.length - 1].grade;
  }

  // ════════════════════════ 5. 텍스트 (검열 표기 · 훼손) ════════════════════════
  /** "[[mem_201|이리나]]" → mem_201 을 태우면 █ 로 가려지는 구간. 키가 압류품 id 가 아니면 조건식으로 본다. */
  function segments(text) {
    const s = String(text == null ? '' : text)
      .replace(/\{player\}/g, D.meta.protagonist.name)
      .replace(/\{id\}/g, D.meta.protagonist.id);
    const out = [];
    const re = /\[\[([^|\]]+)\|([^\]]*)\]\]/g;
    let last = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > last) out.push({ t: s.slice(last, m.index), r: false });
      const key = m[1].trim();
      out.push({ t: m[2], r: MEM[key] ? S.burned.includes(key) : evalCond(key) });
      last = re.lastIndex;
    }
    if (last < s.length) out.push({ t: s.slice(last), r: false });
    return out;
  }
  const blot = (t) => '█'.repeat(chars(t).length);
  function plain(text) { return segments(text).map((g) => (g.r ? blot(g.t) : g.t)).join(''); }

  const GLYPHS = chars('█▓▒░#%&?¿※∎ㅁㅂㄱㅎ');
  function corruptHTML(text, level, seed, tick) {
    const segs = segments(text);
    let out = '', i = 0;
    for (const g of segs) {
      if (g.r) { out += '<span class="redact">' + blot(g.t) + '</span>'; continue; }
      for (const ch of chars(g.t)) {
        i++;
        if (level > 0 && !/\s/.test(ch) && (hash(seed + ':' + i) < level * 0.75 || hash(seed + ':' + (tick || 0) + ':' + i) < level * 0.25)) {
          out += '<span class="cor">' + esc(GLYPHS[Math.floor(hash(seed + 'g' + i + ':' + (tick || 0)) * GLYPHS.length)]) + '</span>';
        } else out += esc(ch);
      }
    }
    return out;
  }
  const richHTML = (text) => corruptHTML(text, 0, '');

  const E = {};

  // ════════════════════════ 7. 진행 제어 (중단 가능한 대기) ════════════════════════
  class Abort extends Error {}
  class GameOver extends Error {}
  const pending = new Set();
  function wait(fn) {
    return new Promise((resolve, reject) => {
      const p = { reject };
      pending.add(p);
      fn((v) => { if (!pending.has(p)) return; pending.delete(p); resolve(v); });
    });
  }
  const sleep = (ms) => wait((res) => setTimeout(res, ms));
  function abortFlow() {
    const ps = Array.from(pending); pending.clear();

    ui.advance = ui.pickResolver = ui.actionResolver = ui.endShift = ui.finaleSubmit = ui.choiceKeys = null;
  }
  function checkGameOver() {
    if (S.phase === 'ending') return;
